name: AI Teacher CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Backend Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Validate Python Syntax (py_compile)
        run: |
          python -m py_compile backend/app/main.py backend/app/**/*.py

      - name: Validate JavaScript Syntax (node -c)
        run: |
          node -c frontend/app.js
          node -c app.js
          node -c api/client.js

      - name: Initialize Database & Seed Concepts
        run: |
          python database/init_db.py

      - name: Run Automated End-to-End Test Suite (11 Tests)
        run: |
          python backend/tests/test_api.py

      - name: Run Terminal Pedagogical Demo
        run: |
          python demo.py
